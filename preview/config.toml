onboarding = false
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace"],
  [{ token = "terminal_title_stripped", fg = "#89b4fa", bold = true }],
  ["agent"],
]

[ui]
agent_panel_sort = "spaces"
workspace_bar = true
sidebar_agents_scope = "active"
status_indicators = "symbols"   # ⏳ работает / ✋ ждёт ответа / ✓ готово / idle

# --- свои хоткеи -------------------------------------------------------
# Формат: action = "prefix+X" или ["prefix+X", "ctrl+alt+X"]. Дефолты: herdr.dev/docs/config-reference
[keys]
switch_workspace = "ctrl+alt+1..9"                 # ctrl+alt+1 = первый спейс, как вкладки в браузере
next_workspace = ["prefix+]", "ctrl+alt+]"]
previous_workspace = ["prefix+[", "ctrl+alt+["]
focus_agent = "prefix+alt+1..9"                    # прыгнуть к N-му агенту в сайдбаре
# next_tab = ["prefix+n", "ctrl+alt+]"]   # пример переназначения — раскомментируй и поправь

# --- свои вкладки/попапы -------------------------------------------------
# type: "popup" (окно поверх), "pane" (временная панель на весь экран), "shell" (в фоне)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "/Users/yevheniirybak/.local/bin/brain-todo"
description = "список дел из Second Brain"
width = "70%"
height = "80%"

# --- уведомления: агент закончил / ждёт ответа -------------------------
[ui.toast]
delivery = "system"      # системные уведомления macOS; "herdr" — внутри окна; "off"
delay_seconds = 1

[ui.sound]
enabled = true

[theme]
name = "tokyo-night-day"
auto_switch = false

# --- превью форка ---
